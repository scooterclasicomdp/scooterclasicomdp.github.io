<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Scooter Clásico Mar del Plata</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
}

.hero{
    height:100vh;
    background:url('hero.jpg') center center/cover no-repeat;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
}

.hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.5);
}

.hero>*{
    position:relative;
    z-index:1;
}

.logo-portada{
    max-width:500px;
    width:90%;
}

h1{
    font-size:60px;
}
</style>
</head>

<body>

<div class="hero">

<img src="logo-largo.png" class="logo-portada" alt="Logo">

<h1>Scooter Clásico Mar del Plata</h1>

<p>Desde 2014 compartiendo la pasión scooterista</p>

</div>

</body>
</html>
