<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scooter Clásico Mar del Plata</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
}

.hero{
    height:100vh;
    background:
    linear-gradient(
        rgba(0,0,0,.60),
        rgba(0,0,0,.60)
    ),
    url('hero.jpg');

    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    color:white;
}

.logo{
    width:800px;
    max-width:90%;
    margin-bottom:30px;

    filter:
        drop-shadow(0 0 10px rgba(0,0,0,.9))
        drop-shadow(0 0 20px rgba(0,0,0,.9));
}

h1{
    font-size:4rem;
    margin:0;
}

p{
    font-size:1.5rem;
}

@media (max-width:768px){

    h1{
        font-size:2.3rem;
    }

    p{
        font-size:1.1rem;
    }

    .logo{
        width:95%;
    }
}

</style>
</head>

<body>

<section class="hero">

   <img src="https://scooterclasicomdp.github.io/SCMDP_LOGO.png" class="logo" alt="Scooter Clásico Mar del Plata">

    <h1>Scooter Clásico Mar del Plata</h1>

    <p>
        Desde 2014 compartiendo la pasión scooterista
    </p>

</section>

</body>
</html>
