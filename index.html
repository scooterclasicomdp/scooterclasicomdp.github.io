<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scooter Clásico Mar del Plata</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

/* MENU */

nav{
    position:fixed;
    top:0;
    width:100%;
    background:rgba(0,0,0,.80);
    backdrop-filter:blur(8px);
    z-index:999;
}

.nav-container{
    max-width:1200px;
    margin:auto;
    padding:12px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo-menu{
    display:flex;
    align-items:center;
    gap:12px;
    color:white;
    font-weight:bold;
    font-size:1.3rem;
}

.logo-menu img{
    width:60px;
    height:60px;
    object-fit:contain;
}

nav ul{
    list-style:none;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

/* PORTADA */

.hero{
    height:100vh;

    background:
    linear-gradient(
        rgba(0,0,0,.55),
        rgba(0,0,0,.55)
    ),
    url('hero.jpg');

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    text-align:center;
    color:white;
}

.logo-portada{
    width:350px;
    max-width:75%;
    margin-bottom:25px;

    filter:

}
