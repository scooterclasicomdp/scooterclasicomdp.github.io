:root{
    --azul:#0b2545;
    --naranja:#e67e22;
    --crema:#f5f0e6;
    --gris:#444;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Poppins',sans-serif;
    background:var(--crema);
    color:var(--gris);
}

h1,h2,h3{
    font-family:'Playfair Display',serif;
}

nav{
    position:fixed;
    top:0;
    width:100%;
    background:rgba(11,37,69,.92);
    backdrop-filter:blur(10px);
    z-index:1000;
}

.nav-container{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    color:white;
    font-weight:600;
    font-size:1.1rem;
}

.logo-navbar{
    width:42px;
    height:42px;
    object-fit:contain;
}

nav ul{
    display:flex;
    gap:20px;
    list-style:none;
}

nav a{
    text-decoration:none;
    color:white;
}

nav a:hover{
    color:#d7c09e;
}
